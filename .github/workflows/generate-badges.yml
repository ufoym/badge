name: Generate badges

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: >
      github.actor != 'github-actions[bot]' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG badges
        env:
          BADGE_GITHUB_TOKEN: ${{ secrets.BADGE_GITHUB_TOKEN }}
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/generate-badges.js

      - name: Commit badge updates
        run: |
          git add badges

          if git diff --cached --quiet -- badges; then
            echo "No badge changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated badges"
          git push
